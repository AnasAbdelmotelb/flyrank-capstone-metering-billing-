run: .venv/bin/python -m app.run
seed: .venv/bin/python -m app.seed
test: .venv/bin/python -m pytest -q
base_url: http://127.0.0.1:8000
endpoints:
  health: GET /health
  generate: POST /generate
  usage: GET /usage
  checkout: POST /billing/checkout
  stripe_webhook: POST /webhooks/stripe
  history: GET /usage/history
  alerts: GET /jobs/alerts
authentication: Bearer API key printed once by seed; POST also requires Idempotency-Key
status: implemented-live-stripe-verification-pending
